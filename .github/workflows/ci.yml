# Fork-owned workflow (qvictl/koreader-base): not part of upstream koreader-base.
#
# CI for `main` and pull requests to it (a GitHub Actions port of upstream's CircleCI
# lint + emulator build & test jobs, in the same `koreader/kobase` docker image):
#   - Lint                 : shellcheck/shfmt, luacheck, cmakelint (.ci/lint_script.sh)
#   - Build and unit tests : emulator build, FFI cdecls check, bincheck, unit tests (busted,
#                            with luacov)
#   - Coverage             : affected-suite unit diff >=80% (see CONTRIBUTING.md)
# Product releases run full unit/integration and whole-coverage gates.
# The "Tests policy" check lives in tests_policy.yml (it must re-run when labels change).

name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      pr:
        description: 'Pull request number (when dispatched on a PR branch, e.g. by the upstream sync)'
        required: false
        type: string

concurrency:
  # Keep separate push commits; each uses its own event.before comparison.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || (github.event_name == 'push' && github.sha) || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CACHE_EPOCH: qv2
  DOCKER_IMG: koreader/kobase:5.0.0-22.04

defaults:
  run:
    shell: bash --noprofile --norc -eo pipefail {0}

jobs:

  # Work. {{{

  upstream-lint:
    name: Upstream lint
    runs-on: ubuntu-26.04
    container:
      image: koreader/kobase:5.0.0-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          clean: false
          fetch-depth: 1
          show-progress: false
      - name: Lint
        env:
          BASH_ENV: /home/ko/.bashrc
          PARALLEL_JOBS: '4'
        run: |
          git config --global --add safe.directory "${PWD}"
          ./.ci/lint_script.sh

  emulator:
    name: Emulator build and unit tests
    runs-on: ubuntu-26.04
    timeout-minutes: 240
    env:
      CCACHE_DIR: /home/runner/.cache/ccache
      # (CI=1: no -march=native, the build is cached and run on other runners)
      MAKEFLAGS: OUTPUT_DIR=build PARALLEL_JOBS=4 CI=1
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          clean: false
          fetch-depth: 0
          filter: tree:0
          show-progress: false
      - name: Select affected unit suites
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_NUMBER: ${{ inputs.pr }}
          PUSH_BEFORE: ${{ github.event.before }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 .ci/fork/select_tests_test.py
          args=()
          case "${EVENT_NAME}" in
            pull_request) args+=(--base "${PR_BASE}") ;;
            push) args+=(--base "${PUSH_BEFORE}") ;;
            workflow_dispatch)
              if [[ -n "${PR_NUMBER}" ]]; then
                base="$(gh pr view "${PR_NUMBER}" --json baseRefOid --jq .baseRefOid)"
                args+=(--base "${base}")
              fi
              ;;
          esac
          python3 .ci/fork/select_tests.py "${args[@]}" --out unit-selection.json
          cat unit-selection.json >>"${GITHUB_STEP_SUMMARY}"
      - name: Fetch
        run: |
          docker pull --quiet "${DOCKER_IMG}"
          mkdir -p "${CCACHE_DIR}"
          ./.ci/build_script.sh fetchthirdparty
          ./.ci/build_script.sh TARGET= cache-key
          sudo chown -R "$(id -u):$(id -g)" .
          cat cache-key | head -n 20
      - name: Restore build directory
        id: build-restore
        uses: actions/cache/restore@v6.1.0
        with:
          path: &BUILD_PATHS |
            build/*
            !build/cmake
            !build/staging
            !build/thirdparty
          key: ${{ env.CACHE_EPOCH }}-emu-build-${{ hashFiles('cache-key') }}
      - name: Restore build cache
        id: ccache-restore
        uses: actions/cache/restore@v6.1.0
        with:
          path: /home/runner/.cache/ccache
          key: ${{ env.CACHE_EPOCH }}-emu-ccache-${{ hashFiles('cache-key') }}
          restore-keys: ${{ env.CACHE_EPOCH }}-emu-ccache-
          lookup-only: ${{ steps.build-restore.outputs.cache-hit }}
      - name: Restore download cache
        id: download-restore
        uses: actions/cache/restore@v6.1.0
        with:
          path: &DOWNLOAD_PATHS |
            thirdparty/*/build
          key: ${{ env.CACHE_EPOCH }}-download-${{ hashFiles('Makefile', 'thirdparty/*/CMakeLists.txt') }}
          lookup-only: ${{ steps.build-restore.outputs.cache-hit }}
      - name: Download
        if: steps.build-restore.outputs.cache-hit != 'true' && steps.download-restore.outputs.cache-hit != 'true'
        run: |
          ./.ci/build_script.sh download-all
          sudo chown -R "$(id -u):$(id -g)" .
      - name: Save download cache
        uses: actions/cache/save@v6.1.0
        if: steps.build-restore.outputs.cache-hit != 'true' && steps.download-restore.outputs.cache-hit != 'true'
        with:
          path: *DOWNLOAD_PATHS
          key: ${{ steps.download-restore.outputs.cache-primary-key }}
      - name: Build
        id: build
        if: steps.build-restore.outputs.cache-hit != 'true'
        run: |
          ./.ci/build_script.sh
          sudo chown -R "$(id -u):$(id -g)" . "${CCACHE_DIR}"
      - name: Save build cache
        uses: actions/cache/save@v6.1.0
        if: >
          contains('failure success', steps.build.conclusion) && !cancelled()
          && steps.ccache-restore.outputs.cache-hit != 'true'
        with:
          path: /home/runner/.cache/ccache
          key: ${{ steps.ccache-restore.outputs.cache-primary-key }}
      - name: Check FFI cdecls are up-to-date
        if: steps.build.conclusion == 'success'
        run: |
          ./.ci/build_script.sh ffi
          sudo chown -R "$(id -u):$(id -g)" .
          git --no-pager diff --color=always --exit-code ffi
      - name: Save build directory
        uses: actions/cache/save@v6.1.0
        if: steps.build.conclusion == 'success'
        with:
          path: *BUILD_PATHS
          key: ${{ steps.build-restore.outputs.cache-primary-key }}
      - name: Check binaries
        run: |
          ./.ci/build_script.sh bincheck
          sudo chown -R "$(id -u):$(id -g)" .
      - name: Unit tests (with coverage)
        run: |
          # Do not mix restored/generated statistics with a partial or empty selection.
          find build -name 'luacov.stats.out*' -not -path '*/staging/*' -delete
          rm -rf coverage
          # (-j 1: the test processes accumulate their luacov stats in the same file)
          ./.ci/build_script.sh --assume-old=all test T="--selection /home/ko/base/unit-selection.json --coverage -j 1 -o /home/ko/base/junit.xml"
          sudo chown -R "$(id -u):$(id -g)" .
      - name: Collect coverage & luajit
        if: ${{ !cancelled() }}
        run: |
          mkdir -p coverage
          n=0
          while read -r f; do
            n=$((n + 1))
            cp "${f}" "coverage/unit-${n}.stats.out"
          done < <(find build -name 'luacov.stats.out*' -not -path '*/staging/*')
          echo "${n} stats file(s)"
          head -c 400 coverage/unit-1.stats.out 2>/dev/null || true
          echo
          ldd build/luajit || true
          mkdir -p pkg/koreader/spec pkg/koreader/libs
          cp -L build/luajit pkg/koreader/
          cp -rL build/spec/rocks pkg/koreader/spec/
          find build/libs -maxdepth 1 -name 'libluajit*' -exec cp -L {} pkg/koreader/libs/ \; || true
          tar -C pkg -cJf base-luajit.tar.xz koreader
      - name: Upload coverage
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: unit-coverage
          path: |
            coverage/
            base-luajit.tar.xz
            unit-selection.json
            junit.xml
          if-no-files-found: ignore
          retention-days: 14

  coverage-report:
    name: Coverage report
    needs: emulator
    if: ${{ !cancelled() && needs.emulator.result == 'success' }}
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      pull-requests: write
    outputs:
      ok: ${{ steps.coverage.outputs.ok }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          clean: false
          fetch-depth: 0
          filter: tree:0
          show-progress: false
      - name: Download coverage
        uses: actions/download-artifact@v8.0.2
        with:
          name: unit-coverage
          path: artifacts/unit-coverage
      - name: Coverage gates
        id: coverage
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: ./.ci/fork/coverage.sh artifacts
      - name: Upload result
        uses: actions/upload-artifact@v7.0.2
        with:
          name: coverage-result
          path: coverage-result.json
          retention-days: 30

  coverage-publish:
    # Partial PR/push data never creates whole-coverage history. Releases publish
    # full measurements through KOReader; explicit manual full runs remain available.
    name: Coverage history
    needs: coverage-report
    if: github.event_name == 'workflow_dispatch' && !inputs.pr && github.ref == 'refs/heads/main' && needs.coverage-report.result == 'success' && needs.coverage-report.outputs.ok == 'true'
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          clean: false
          # main's history (commit order).
          fetch-depth: 0
          filter: tree:0
          show-progress: false
          sparse-checkout: .ci
      - name: Download result
        uses: actions/download-artifact@v8.0.2
        with:
          name: coverage-result
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./.ci/fork/coverage_publish.sh coverage-result.json

  # }}}

  # Required checks (gates). {{{

  lint:
    name: Lint
    needs: upstream-lint
    if: ${{ always() }}
    runs-on: ubuntu-26.04
    steps:
      - run: '[[ "${{ needs.upstream-lint.result }}" == success ]]'

  build:
    name: Build and unit tests
    needs: emulator
    if: ${{ always() }}
    runs-on: ubuntu-26.04
    steps:
      - run: '[[ "${{ needs.emulator.result }}" == success ]]'

  coverage:
    name: Coverage
    needs: coverage-report
    if: ${{ always() }}
    runs-on: ubuntu-26.04
    steps:
      - run: |
          echo "report: ${{ needs.coverage-report.result }}, ok: ${{ needs.coverage-report.outputs.ok }}"
          [[ "${{ needs.coverage-report.result }}" == success ]] && [[ "${{ needs.coverage-report.outputs.ok }}" == true ]]

  # }}}

# vim: foldmethod=marker foldlevel=0
